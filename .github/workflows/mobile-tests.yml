name: Mobile tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  EMULATOR_API_LEVEL: 34

jobs:
  espresso:
    name: Espresso (Android instrumented)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Espresso tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: chmod +x gradlew && ./gradlew connectedDebugAndroidTest

      - name: Upload Espresso report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: espresso-report
          path: android/app/build/reports/androidTests/

  appium:
    name: Appium + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the app under test
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Appium and the UiAutomator2 driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: appium/requirements.txt

      - name: Install Python dependencies
        run: pip install -r appium/requirements.txt

      - name: Start Appium server in the background
        run: appium --log-level info > appium-server.log 2>&1 &

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Appium tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: appium
          script: python -m pytest

      - name: Upload Appium reports, screenshots and server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appium-report
          path: |
            appium/reports/
            appium-server.log
